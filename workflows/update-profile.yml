name: Update Profile Statistics

on:
schedule:
- cron: "0 3 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
update-profile:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Create profile directory
    run: mkdir -p profile

  - name: Generate GitHub statistics
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=false&rank_icon=github
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate top languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=false
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate contribution streak
    uses: DenverCoder1/github-readme-streak-stats@main
    with:
      options: username=${{ github.repository_owner }}&theme=default&hide_border=true&date_format=j%20M%20Y
      path: profile/streak.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github: ${{ github.repository_owner }}
      outputs: |
        profile/contribution-snake.svg

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/

      git diff --cached --quiet || git commit -m "chore: update GitHub profile statistics"

      git push
```
