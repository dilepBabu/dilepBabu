<svg
  width="1400"
  height="520"
  viewBox="0 0 1400 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>

  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <linearGradient
    id="background"
    x1="0"
    y1="0"
    x2="1400"
    y2="520"
  >
    <stop offset="0%" stop-color="#08090B"/>
    <stop offset="52%" stop-color="#10120F"/>
    <stop offset="100%" stop-color="#1A130F"/>
  </linearGradient>

  <!-- ===================================================== -->
  <!-- ORANGE -->
  <!-- ===================================================== -->

  <linearGradient
    id="orangeGradient"
    x1="0"
    y1="0"
    x2="1"
    y2="1"
  >
    <stop offset="0%" stop-color="#FFC08A"/>
    <stop offset="40%" stop-color="#FF6B35"/>
    <stop offset="100%" stop-color="#FF3D00"/>
  </linearGradient>

  <!-- ===================================================== -->
  <!-- LIME -->
  <!-- ===================================================== -->

  <linearGradient
    id="limeGradient"
    x1="0"
    y1="0"
    x2="1"
    y2="0"
  >
    <stop offset="0%" stop-color="#D7FF67"/>
    <stop offset="50%" stop-color="#C6FF4A"/>
    <stop offset="100%" stop-color="#89D52C"/>
  </linearGradient>

  <!-- ===================================================== -->
  <!-- TITLE -->
  <!-- ===================================================== -->

  <linearGradient
    id="titleGradient"
    x1="80"
    y1="0"
    x2="780"
    y2="0"
  >
    <stop offset="0%" stop-color="#FFF9ED"/>
    <stop offset="52%" stop-color="#F3E9D2"/>
    <stop offset="100%" stop-color="#FF7440"/>
  </linearGradient>

  <!-- ===================================================== -->
  <!-- GRID -->
  <!-- ===================================================== -->

  <pattern
    id="microGrid"
    width="32"
    height="32"
    patternUnits="userSpaceOnUse"
  >

    <path
      d="M32 0H0V32"
      stroke="#F3E9D2"
      stroke-opacity="0.045"
      stroke-width="1"
    />

  </pattern>

  <!-- ===================================================== -->
  <!-- GLOW -->
  <!-- ===================================================== -->

  <radialGradient id="orangeGlow">

    <stop
      offset="0%"
      stop-color="#FF6B35"
      stop-opacity="0.36"
    />

    <stop
      offset="100%"
      stop-color="#FF6B35"
      stop-opacity="0"
    />

  </radialGradient>

  <radialGradient id="limeGlow">

    <stop
      offset="0%"
      stop-color="#C6FF4A"
      stop-opacity="0.18"
    />

    <stop
      offset="100%"
      stop-color="#C6FF4A"
      stop-opacity="0"
    />

  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <!-- ===================================================== -->
  <!-- TEXT -->
  <!-- ===================================================== -->

  <style>

    .mono {

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      letter-spacing: 3px;

    }

    .title {

      font-family:
        Inter,
        Arial,
        sans-serif;

      font-weight: 900;
      letter-spacing: 9px;

    }

    .signal {

      animation:
        signalPulse 2.8s
        ease-in-out
        infinite;

      transform-origin:
        center;

    }

    .orbit {

      animation:
        orbitClockwise
        12s
        linear
        infinite;

      transform-origin:
        1110px 235px;

    }

    .orbitReverse {

      animation:
        orbitCounter
        17s
        linear
        infinite;

      transform-origin:
        1110px 235px;

    }

    .blink {

      animation:
        blink
        2s
        ease-in-out
        infinite;

    }

    .scan {

      animation:
        scan
        6s
        linear
        infinite;

    }

    @keyframes signalPulse {

      0%,
      100% {

        opacity:
          .25;

      }

      50% {

        opacity:
          1;

      }

    }

    @keyframes orbitClockwise {

      from {

        transform:
          rotate(0deg);

      }

      to {

        transform:
          rotate(360deg);

      }

    }

    @keyframes orbitCounter {

      from {

        transform:
          rotate(360deg);

      }

      to {

        transform:
          rotate(0deg);

      }

    }

    @keyframes blink {

      0%,
      45%,
      100% {

        opacity:
          1;

      }

      50% {

        opacity:
          .22;

      }

    }

    @keyframes scan {

      0% {

        transform:
          translateX(-700px);

        opacity:
          0;

      }

      15% {

        opacity:
          .7;

      }

      80% {

        opacity:
          .7;

      }

      100% {

        transform:
          translateX(1800px);

        opacity:
          0;

      }

    }

  </style>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect
  width="1400"
  height="520"
  rx="30"
  fill="url(#background)"
/>

<rect
  width="1400"
  height="520"
  rx="30"
